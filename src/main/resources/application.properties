spring.application.name=MoveOn

# DTO Location (Mapper XML에서 DTO 이름을 짧게 쓰기 위함)
mybatis.type-aliases-package=com.moveon.dto

# SQL Query Location
mybatis.mapper-locations=classpath:mapper/**/*.xml

# DTO Mapping camel case (USER_ID -> userId)
mybatis.configuration.map-underscore-to-camel-case=true

# JSP Location
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Mail Sender (인증번호 발송)
# 계정 정보(spring.mail.username / password)는 credentials/secret.properties 에 있음
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com

# 접속 정보는 아래 파일에서 (커밋 안 됨)
spring.config.import=optional:file:credentials/secret.properties
