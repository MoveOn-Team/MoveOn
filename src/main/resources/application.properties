spring.application.name=MoveOn

# Mapper XML에서 UserDTO처럼 짧은 클래스 이름을 사용할 수 있도록 DTO 패키지를 지정한다.
mybatis.type-aliases-package=com.moveon.dto

# MyBatis SQL Mapper XML 파일의 위치를 지정한다.
mybatis.mapper-locations=classpath:mapper/**/*.xml

# DB의 snake_case 컬럼명을 Java의 camelCase 필드명으로 자동 변환한다. (USER_ID -> userId)
mybatis.configuration.map-underscore-to-camel-case=true

# JSP 화면 파일의 기본 위치와 확장자를 지정한다.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 이메일 인증번호와 안내 메일을 발송할 네이버 SMTP 서버 설정이다.
# 실제 메일 계정과 비밀번호는 credentials/secret.properties에서 관리한다.
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com

# DB와 메일 접속 정보가 들어 있는 별도 파일을 불러온다. 이 파일은 Git에 커밋하지 않는다.
spring.config.import=optional:file:credentials/secret.properties
